name: Atualizar filmes

on:
  schedule:
    # 05:00 UTC = 06:00 em Lisboa no verão (WEST) e 05:00 no inverno (WET). O GitHub pode atrasar alguns minutos.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      so_pagina:
        description: "Só regenerar a página (sem recolher dados do site)"
        type: boolean
        default: false
  # um push que mexa no visual ou no código atualiza a página, sem recolher nada
  push:
    branches: [main]
    paths:
      - estilo.css
      - pagina.js
      - filmes_tv.py
      - .github/workflows/atualizar.yml

# uma execução de cada vez, para dois commits de dados não colidirem
concurrency:
  group: filmes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # push e disparo "só página": usa os dados já guardados em data/, sem pedidos ao site nem ao TMDB
      SO_PAGINA: ${{ github.event_name == 'push' || github.event.inputs.so_pagina == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # a ponta do ramo (com os dados mais recentes do bot), não o commit do evento

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m unittest discover -s tests

      - name: Recolher, identificar e gerar a página
        if: env.SO_PAGINA != 'true'
        run: python filmes_tv.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Gerar a página a partir dos dados guardados
        if: env.SO_PAGINA == 'true'
        run: python filmes_tv.py --relatorio

      # só airings e matches (data/*.csv) ficam no repo; o dataset de ratings volta a ser descarregado
      - name: Guardar dados no repositório
        if: env.SO_PAGINA != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar dados"
            # se entretanto alguém fez push, junta os commits em vez de falhar
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      - name: Preparar a página
        run: |
          mkdir site
          cp filmes.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
