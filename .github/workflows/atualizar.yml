name: Atualizar filmes

on:
  schedule:
    # 05:00 UTC = 06:00 em Lisboa no verão (WEST) e 05:00 no inverno (WET). O GitHub pode atrasar alguns minutos.
    - cron: "0 5 * * *"
  workflow_dispatch:

# uma execução de cada vez, para dois commits de dados não colidirem
concurrency:
  group: filmes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m unittest discover -s tests

      - name: Recolher, identificar e gerar a página
        run: python filmes_tv.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      # só airings e matches (data/*.csv) ficam no repo; o dataset de ratings volta a ser descarregado
      - name: Guardar dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "chore: atualizar dados" && git push; }

      - name: Preparar a página
        run: |
          mkdir site
          cp filmes.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
